<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>会員ポータル - CHOCOZAP</title>
    <style>
        :root {
            --surface-card: rgba(252, 251, 250, 0.92);
            --surface-alt: rgba(234, 229, 220, 0.7);
            --border-color: #ded7cb;
            --text-main: #332d29;
            --text-muted: #82786f;
            --accent-warm: #c86d4b;
            --radius-lg: 20px;
            --radius-sm: 10px;
            
            --font-logo: "Futura", "Century Gothic", -apple-system, sans-serif;
            --font-en: "Times New Roman", "YuMincho", "Hiragino Mincho ProN", serif;
            --font-jp: "Zen Maru Gothic", "Hiragino Maru Gothic Pro", "Yu Gothic Rounded", "Rounded Mplus 1c", sans-serif;
        }

        body {
            font-family: var(--font-en);
            /* 🖼️ 画面全体に広がる背景画像（フッターの後ろまで敷き詰め） */
            background-image: linear-gradient(rgba(30, 25, 22, 0.55), rgba(30, 25, 22, 0.55)), url('https://images.unsplash.com/photo-1534438327276-14e5300c3a48?auto=format&fit=crop&w=1920&q=80');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: var(--text-main);
            margin: 0;
            padding-top: 80px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        /* 🌐 ヘッダー（history.htmlと同じ動き：普段は透明、ホバーで白背景＆影） */
        .site-header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 80px;
            background-color: transparent;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 48px;
            box-sizing: border-box;
            z-index: 1000;
            transition: background-color 0.4s ease, box-shadow 0.4s ease;
        }

        .site-header:hover {
            background-color: #ffffff;
            box-shadow: 0 4px 20px rgba(51, 45, 41, 0.1);
        }

        .header-logo {
            font-family: var(--font-logo);
            font-size: 1.4rem;
            font-weight: 300;
            letter-spacing: 0.25em;
            color: #ffffff;
            text-decoration: none;
            text-shadow: 0 1px 4px rgba(0,0,0,0.5);
            transition: color 0.4s ease, text-shadow 0.4s ease;
        }

        .site-header:hover .header-logo {
            color: var(--text-main);
            text-shadow: none;
        }

        .header-nav {
            display: flex;
            gap: 32px;
            list-style: none;
            margin: 0;
            padding: 0;
            align-items: center;
        }

        .header-nav a {
            font-family: var(--font-logo);
            color: #ffffff;
            text-decoration: none;
            font-size: 0.85rem;
            letter-spacing: 0.2em;
            font-weight: 500;
            cursor: pointer;
            text-shadow: 0 1px 4px rgba(0,0,0,0.5);
            transition: color 0.4s ease, opacity 0.2s, text-shadow 0.4s ease;
        }

        .site-header:hover .header-nav a {
            color: var(--text-main);
            text-shadow: none;
        }

        .header-nav a:hover { opacity: 0.6; }
        .auth-only { display: none; }
        
        .nav-logout { 
            color: #ff8b71 !important; 
            transition: color 0.4s ease;
        }
        .site-header:hover .nav-logout {
            color: #b55232 !important;
        }

        .portal-container {
            max-width: 1000px;
            width: 100%;
            padding: 0 20px;
            box-sizing: border-box;
            flex: 1;
            margin-bottom: 80px;
        }

        /* 🔒 ログインカード */
        .login-card {
            background: var(--surface-card);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: var(--radius-lg);
            padding: 48px 40px;
            max-width: 420px;
            margin: 60px auto;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
            text-align: center;
        }

        .login-card h2 {
            font-family: var(--font-en);
            margin-top: 0;
            font-size: 1.6rem;
            font-weight: normal;
            letter-spacing: 0.1em;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .form-group label {
            display: block;
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 6px;
            font-weight: 600;
            letter-spacing: 0.05em;
        }

        .form-group input {
            font-family: var(--font-en);
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            box-sizing: border-box;
            font-size: 1rem;
            background: rgba(255, 255, 255, 0.8);
            color: var(--text-main);
            outline: none;
        }

        #portal-content { display: none; }

        .portal-header {
            margin: 40px 0 24px 0;
        }

        .portal-title h1 {
            font-family: var(--font-en);
            font-size: 2.4rem;
            font-weight: normal;
            margin: 0 0 4px 0;
            letter-spacing: 0.08em;
            color: #ffffff;
            text-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }
        .portal-title h1 span { color: #ff9e80; font-style: italic; }
        .jp-text { font-family: var(--font-jp); }

        /* 📊 ステータス表示エリア（グラスモーフィズム） */
        .status-strip {
            background: var(--surface-card);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: var(--radius-lg);
            padding: 28px 36px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.2);
        }

        .status-strip-item {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .rank-badge {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, #d97757, #b55232);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            font-weight: 900;
            font-family: Impact, sans-serif;
            box-shadow: 0 4px 12px rgba(181, 82, 50, 0.3);
        }

        .btn {
            font-family: var(--font-jp);
            background: var(--text-main);
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: var(--radius-sm);
            font-weight: 500;
            letter-spacing: 0.05em;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            text-align: center;
            transition: opacity 0.2s;
        }

        .btn:hover { opacity: 0.9; }

        /* 🌲 フッター（ヘッダーと連動：普段は透明、ホバーで白背景＆影） */
        .site-footer {
            width: 100%;
            background-color: transparent;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding: 40px 48px;
            box-sizing: border-box;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background-color 0.4s ease, box-shadow 0.4s ease, border-top 0.4s ease;
        }

        .site-footer:hover {
            background-color: #ffffff;
            box-shadow: 0 -4px 20px rgba(51, 45, 41, 0.1);
            border-top: 1px solid var(--border-color);
        }

        .footer-logo {
            font-family: var(--font-logo);
            font-size: 1.2rem;
            font-weight: 300;
            letter-spacing: 0.25em;
            color: #ffffff;
            text-decoration: none;
            text-shadow: 0 1px 4px rgba(0,0,0,0.5);
            transition: color 0.4s ease, text-shadow 0.4s ease;
        }

        .site-footer:hover .footer-logo {
            color: var(--text-main);
            text-shadow: none;
        }

        .footer-copy {
            font-family: var(--font-en);
            font-size: 0.78rem;
            color: rgba(255, 255, 255, 0.7);
            letter-spacing: 0.08em;
            text-shadow: 0 1px 4px rgba(0,0,0,0.5);
            transition: color 0.4s ease, text-shadow 0.4s ease;
        }

        .site-footer:hover .footer-copy {
            color: var(--text-muted);
            text-shadow: none;
        }
    </style>
</head>
<body>

    <!-- 🌐 ヘッダー -->
    <header class="site-header">
        <a href="/portal" class="header-logo">CHOCOZAP</a>
        <nav>
            <ul class="header-nav">
                <li class="auth-only"><a href="/portal">PORTAL</a></li>
                <li class="auth-only"><a href="/history">HISTORY</a></li>
                <li class="auth-only"><a href="/esthe">ESTHE</a></li>
                <li class="auth-only"><a onclick="handleLogout()" class="nav-logout">LOGOUT</a></li>
            </ul>
        </nav>
    </header>

    <div class="portal-container">

        <!-- 🔒 1. ログインフォーム -->
        <div id="login-section" class="login-card">
            <h2>MEMBER LOGIN</h2>
            <p class="jp-text" style="color: var(--text-muted); font-size: 0.85rem; margin-bottom: 24px;">ご登録のメールアドレスを入力してください</p>
            
            <form id="login-form" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label class="jp-text" for="email-input">メールアドレス</label>
                    <input type="email" id="email-input" placeholder="example@email.com" required>
                </div>
        
                <div class="form-group">
                    <label class="jp-text" for="password-input">パスワード</label>
                    <input type="password" id="password-input" placeholder="••••••••" required>
                </div>

                <button type="submit" class="btn" style="width: 100%;">ログイン</button>
            </form>
            <p id="login-error" style="color: #b55232; font-size: 0.85rem; margin-top: 12px; display: none;"></p>

            <div style="margin-top: 24px; border-top: 1px solid var(--border-color); padding-top: 20px;">
                <a href="/api/start-register" class="btn" style="width: 100%; box-sizing: border-box; background: var(--surface-alt); color: var(--text-main); border: 1px solid var(--border-color);">新規会員登録はこちら</a>      
            </div>
        </div>

        <!-- 👤 2. マイページ -->
        <div id="portal-content">
            <div class="portal-header">
                <div class="portal-title">
                    <h1>WELCOME, <span id="user-name-display">-</span></h1>
                    <p class="jp-text" style="color: rgba(255,255,255,0.85); margin: 0; letter-spacing: 0.05em; text-shadow: 0 1px 4px rgba(0,0,0,0.3);">おかえりなさい、<strong id="user-name-sub-display">-</strong> 様</p>
                </div>
            </div>

            <!-- 📊 ステータス表示エリア -->
            <div class="status-strip">
                <div class="status-strip-item">
                    <div class="rank-badge" id="rank-badge-display">-</div>
                    <div>
                        <div style="font-size: 1.1rem; font-weight: 500;" id="rank-name-display">-</div>
                        <div class="jp-text" style="font-size: 0.82rem; color: var(--text-muted);">今月の来館: <strong id="visit-count-display" style="color: var(--text-main);">0回</strong></div>
                    </div>
                </div>

                <div class="status-strip-item" style="text-align: right;">
                    <div>
                        <div class="jp-text" style="font-size: 0.82rem; color: var(--text-muted);">総トレーニング時間</div>
                        <div style="font-size: 1.2rem; font-weight: 500;" id="total-time-display">0分</div>
                    </div>
                </div>
            </div>

        </div>

    </div>

    <!-- 🌲 フッター -->
    <footer class="site-footer">
        <a href="/portal" class="footer-logo">CHOCOZAP</a>
        <div class="footer-copy">&copy; 2026 CHOCOZAP</div>
    </footer>

    <script>
        async function checkLogin() {
            try {
                const res = await fetch('/api/member/me');
                const data = await res.json();
                if (data.status === 'success') {
                    showPortal(data);
                } else {
                    showLogin();
                }
            } catch (e) {
                showLogin();
            }
        }

        async function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('email-input').value;
            const password = document.getElementById('password-input').value;
            const errorEl = document.getElementById('login-error');
            errorEl.style.display = 'none';

            const res = await fetch('/api/member/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: email, password: password })
            });

            const data = await res.json();
            if (data.status === 'success') {
                checkLogin();
            } else {
                errorEl.innerText = data.message || 'ログインに失敗しました。';
                errorEl.style.display = 'block';
            }
        }

        async function handleLogout() {
            await fetch('/api/member/logout', { method: 'POST' });
            showLogin();
        }

        function showLogin() {
            document.getElementById('login-section').style.display = 'block';
            document.getElementById('portal-content').style.display = 'none';
            document.querySelectorAll('.auth-only').forEach(el => el.style.display = 'none');
        }

        function showPortal(data) {
            document.getElementById('login-section').style.display = 'none';
            document.getElementById('portal-content').style.display = 'block';
            document.querySelectorAll('.auth-only').forEach(el => el.style.display = 'inline-block');

            const m = data.member;
            const s = data.score;

            document.getElementById('user-name-display').innerText = m.name;
            document.getElementById('user-name-sub-display').innerText = m.name;
            document.getElementById('rank-badge-display').innerText = s.rank;
            document.getElementById('rank-name-display').innerText = s.rank + ' MEMBER';
            document.getElementById('visit-count-display').innerText = s.visit_count + '回';
            document.getElementById('total-time-display').innerText = s.total_duration_fmt;
        }

        window.addEventListener('DOMContentLoaded', checkLogin);
    </script>
</body>
</html>
