<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>ジム セキュリティ＆人流監視ダッシュボード</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 20px;
        }
        .container {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }
        .panel {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            width: 480px;
            box-sizing: border-box;
        }
        .panel h2 {
            margin-top: 0;
            font-size: 1.2rem;
            border-bottom: 2px solid #3498db;
            padding-bottom: 8px;
            color: #2980b9;
        }
        /* 履歴用の幅広パネル */
        .panel-full {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            max-width: 980px;
            margin: 0 auto;
            box-sizing: border-box;
        }
        .panel-full h2 {
            margin-top: 0;
            font-size: 1.2rem;
            border-bottom: 2px solid #2ecc71;
            padding-bottom: 8px;
            color: #27ae60;
        }
        .video-box {
            text-align: center;
            background: #000;
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 15px;
        }
        .video-box img {
            width: 100%;
            height: auto;
            display: block;
        }
        .status-table {
            width: 100%;
            border-collapse: collapse;
        }
        .status-table th, .status-table td {
            padding: 8px 12px;
            border-bottom: 1px solid #ddd;
            text-align: left;
            font-size: 0.95rem;
        }
        .status-table th {
            width: 40%;
            color: #555;
        }
        /* 履歴一覧用のテーブル */
        .history-table {
            width: 100%;
            border-collapse: collapse;
            text-align: center;
        }
        .history-table th, .history-table td {
            padding: 10px;
            border-bottom: 1px solid #eee;
            font-size: 0.9rem;
        }
        .history-table th {
            background-color: #f8f9fa;
            color: #555;
        }
        .badge {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: bold;
            color: white;
        }
        .badge-in { background-color: #27ae60; }
        .badge-out { background-color: #7f8c8d; }
        .badge-alert { background-color: #e74c3c; }
        .badge-normal { background-color: #3498db; }

        .alert-box {
            background-color: #e74c3c;
            color: white;
            text-align: center;
            padding: 10px;
            border-radius: 4px;
            font-weight: bold;
            margin-top: 15px;
            display: none;
        }
        .alert-box.active {
            display: block;
            animation: pulse 1s infinite;
        }
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>

    <h1>🏋️‍♂️ ジム セキュリティ・人流監視ダッシュボード</h1>

    <div class="container">
        <!-- 入口ゲートパネル -->
        <div class="panel">
            <h2>🚪 入口ゲート (YOLO + QR)</h2>
            <div class="video-box">
                <img src="/video/entrance" alt="Entrance Stream">
            </div>
            <table class="status-table">
                <tr>
                    <th>入館数 (IN)</th>
                    <td id="in-count" style="color: #27ae60; font-weight: bold; font-size: 1.2rem;">0</td>
                </tr>
                <tr>
                    <th>退館数 (OUT)</th>
                    <td id="out-count" style="color: #c0392b; font-weight: bold; font-size: 1.2rem;">0</td>
                </tr>
                <tr>
                    <th>直近のQR</th>
                    <td id="last-qr">None</td>
                </tr>
            </table>
            <div id="co-trailing-alert" class="alert-box">🚨 共連れ（不正入館）検知アラート！</div>
        </div>

        <!-- トレーニングルームパネル -->
        <div class="panel">
            <h2>👤 トレーニングルーム (顔識別)</h2>
            <div class="video-box">
                <img src="/video/room" alt="Room Stream">
            </div>
            <table class="status-table">
                <tr>
                    <th>追跡中ユーザー</th>
                    <td id="user-name">Guest</td>
                </tr>
                <tr>
                    <th>滞在時間</th>
                    <td id="accumulated-time">0 秒</td>
                </tr>
                <tr>
                    <th>ステータス</th>
                    <td id="overtime-status" style="font-weight: bold;">通常</td>
                </tr>
            </table>
        </div>
    </div>

    <!-- 📋 直近の通行・違反履歴パネル -->
    <div class="panel-full">
        <h2>📋 直近の入退館・違反履歴 (リアルタイム)</h2>
        <table class="history-table">
            <thead>
                <tr>
                    <th>日時</th>
                    <th>方向</th>
                    <th>会員ID</th>
                    <th>判定ステータス</th>
                </tr>
            </thead>
            <tbody id="logs-table-body">
                <tr>
                    <td colspan="4" style="color: #888; padding: 15px;">データを待機中...</td>
                </tr>
            </tbody>
        </table>
    </div>

    <script>
        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const ws = new WebSocket(`${protocol}//${window.location.host}/ws`);

        ws.onmessage = function(event) {
            const data = JSON.parse(event.data);

            // 入口データの更新
            document.getElementById('in-count').innerText = data.in_count;
            document.getElementById('out-count').innerText = data.out_count;
            document.getElementById('last-qr').innerText = data.last_qr;

            // 共連れアラートの切り替え
            const alertBox = document.getElementById('co-trailing-alert');
            if (data.co_trailing_alert) {
                alertBox.classList.add('active');
            } else {
                alertBox.classList.remove('active');
            }

            // ルームデータの更新
            document.getElementById('user-name').innerText = data.user_name;
            document.getElementById('accumulated-time').innerText = data.accumulated_time + ' 秒';

            const statusTd = document.getElementById('overtime-status');
            if (data.is_overtime) {
                statusTd.innerText = "オーバータイム（制限超過）";
                statusTd.style.color = "#e74c3c";
            } else {
                statusTd.innerText = "通常";
                statusTd.style.color = "#27ae60";
            }

            // 履歴テーブルの更新
            if (data.logs && data.logs.length > 0) {
                const tbody = document.getElementById('logs-table-body');
                tbody.innerHTML = '';
                data.logs.forEach(log => {
                    const tr = document.createElement('tr');
                    
                    const dirBadge = log.direction === 'IN' 
                        ? '<span class="badge badge-in">IN (入館)</span>' 
                        : '<span class="badge badge-out">OUT (退館)</span>';

                    const alertBadge = log.is_alert === 1 
                        ? '<span class="badge badge-alert">🚨 共連れ・不正</span>' 
                        : '<span class="badge badge-normal">正常通行</span>';

                    tr.innerHTML = `
                        <td>${log.timestamp}</td>
                        <td>${dirBadge}</td>
                        <td style="font-weight: bold;">${log.member_id}</td>
                        <td>${alertBadge}</td>
                    `;
                    tbody.appendChild(tr);
                });
            }
        };

        ws.onclose = function() {
            console.log("WebSocket接続が切れました。ページを再読み込みしてください。");
        };
    </script>

</body>
</html>
