<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>ADMIN LOGIN - CHOCOZAP SECURITY</title>
    <style>
        :root {
            --bg-color: #ffffff;
            --surface-card: #f7f7f9;
            --surface-alt: #eceef2;
            --border-color: #e4e4e9;
            --border-active: #D8FB54;
            
            --text-main: #0d0d0f;
            --text-muted: #71717a;
            
            --accent-lime: #D8FB54;
            --accent-lime-dark: #b5d432;
            --danger-color: #ff2a5f;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", YuGothic, "Meiryo", sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding-top: 160px;
            padding-bottom: 0;
            padding-left: 20px;
            padding-right: 20px;
            letter-spacing: -0.02em;
            -webkit-font-smoothing: antialiased;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            box-sizing: border-box;
        }

        /* 共通ヘッダー */
        .site-header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(40px) saturate(250%);
            -webkit-backdrop-filter: blur(40px) saturate(250%);
            border-bottom: 1px solid rgba(228, 228, 233, 0.15);
            padding: 20px 20px 16px 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* ロゴ（案C：ミニマル・テック） */
        .header-brand h1 {
            margin: 0 0 12px 0;
            font-size: inherit;
            font-weight: normal;
            text-align: center;
        }
        .logo {
            display: inline-flex;
            align-items: center;
            gap: 14px;
            padding: 8px 18px;
            border: 2px solid var(--text-main);
            background: rgba(255, 255, 255, 0.6);
            color: var(--text-main);
            text-decoration: none;
            white-space: nowrap;
            text-transform: uppercase;
            font-family: ui-monospace, Menlo, Consolas, "SFMono-Regular", monospace;
            transition: background-color 0.2s ease;
        }
        .logo-sq {
            width: 14px;
            height: 14px;
            box-sizing: border-box;
            background: var(--accent-lime);
            border: 2px solid var(--text-main);
            flex-shrink: 0;
            transition: background-color 0.2s ease;
        }
        .logo-name,
        .logo-slash,
        .logo-sub {
            font-size: 1.4rem;
            letter-spacing: 0.22em;
            margin-right: -0.22em;
        }
        .logo-name  { font-weight: 500; }
        .logo-slash { color: var(--accent-lime-dark); }
        .logo-sub   { color: var(--text-muted); font-weight: 400; }
        .logo:hover { background: var(--accent-lime); }
        .logo:hover .logo-sq { background: var(--text-main); }
        .logo:hover .logo-slash,
        .logo:hover .logo-sub { color: var(--text-main); }

        .logo-lg { padding: 14px 28px; gap: 20px; }
        .logo-lg .logo-sq { width: 20px; height: 20px; }
        .logo-lg .logo-name,
        .logo-lg .logo-slash,
        .logo-lg .logo-sub { font-size: 2.2rem; }

        @media (max-width: 600px) {
            .logo { gap: 10px; padding: 6px 12px; }
            .logo-name, .logo-slash, .logo-sub { font-size: 0.95rem; letter-spacing: 0.14em; margin-right: -0.14em; }
            .logo-sq { width: 10px; height: 10px; }
            .logo-lg { padding: 10px 16px; gap: 12px; }
            .logo-lg .logo-sq { width: 12px; height: 12px; }
            .logo-lg .logo-name, .logo-lg .logo-slash, .logo-lg .logo-sub { font-size: 1.1rem; }
        }

        .nav-container {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .nav-btn {
            background: rgba(236, 238, 242, 0.3);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            color: var(--text-main);
            padding: 8px 20px;
            text-decoration: none;
            border-radius: 2px;
            font-size: 0.75rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            border: 1px solid rgba(228, 228, 233, 0.3);
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
            font-family: monospace;
            position: relative;
        }
        .nav-btn:hover {
            border-color: var(--text-main);
            background: rgba(255, 255, 255, 0.7);
        }

        /* フォーム用パネル */
        .main-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .cyber-panel {
            background: var(--surface-card);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 30px;
            width: 100%;
            max-width: 420px;
            box-sizing: border-box;
            box-shadow: 0 4px 20px rgba(0,0,0,0.02);
        }

        .cyber-panel h2 {
            margin-top: 0;
            font-size: 0.9rem;
            font-weight: 900;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--text-main);
            border-bottom: 2px solid var(--text-main);
            padding-bottom: 10px;
            font-family: monospace;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            font-size: 0.75rem;
            font-family: monospace;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: 8px;
            font-weight: 800;
        }

        input {
            width: 100%;
            padding: 12px;
            font-size: 0.95rem;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 2px;
            color: var(--text-main);
            box-sizing: border-box;
            font-family: monospace;
        }

        input:focus {
            outline: none;
            border-color: var(--text-main);
            background: #fff;
        }

        .cyber-btn {
            width: 100%;
            padding: 12px;
            background: var(--accent-lime);
            color: #000;
            border: none;
            border-radius: 2px;
            font-size: 0.8rem;
            font-weight: 900;
            font-family: monospace;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            cursor: pointer;
            transition: background 0.2s;
        }

        .cyber-btn:hover {
            background: #b5d432;
        }

        #errorMsg {
            color: var(--danger-color);
            font-size: 0.8rem;
            text-align: center;
            margin-top: 15px;
            font-weight: 800;
            font-family: monospace;
        }

        .link-row {
            text-align: center;
            margin-top: 20px;
        }

        .link-row a {
            color: var(--text-muted);
            font-size: 0.75rem;
            font-family: monospace;
            text-decoration: none;
            letter-spacing: 0.05em;
            border-bottom: 1px dotted var(--text-muted);
        }

        .link-row a:hover {
            color: var(--text-main);
            border-bottom-color: var(--text-main);
        }

        /* フッター */
        .site-footer {
            margin-top: auto;
            margin-left: -20px;
            margin-right: -20px;
            padding: 32px 20px 20px 20px;
            border-top: 1px solid var(--text-main);
            background: var(--bg-color);
            box-sizing: border-box;
        }

        .footer-inner {
            max-width: 1024px;
            margin: 0 auto;
        }

        .footer-nav {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px 28px;
            font-family: monospace;
            font-size: 0.75rem;
            font-weight: 800;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }
        .footer-nav a {
            color: var(--text-main);
            text-decoration: none;
            padding: 4px 0;
            border-bottom: 2px solid transparent;
            transition: border-color 0.2s ease;
        }
        .footer-nav a:hover,
        .footer-nav a.current {
            border-bottom-color: var(--accent-lime);
        }

        .footer-logo {
            display: flex;
            justify-content: center;
            margin: 28px 0 16px 0;
        }

        .footer-bottom {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            padding-top: 12px;
            border-top: 1px solid var(--border-color);
            font-family: monospace;
            font-size: 0.75rem;
            color: var(--text-muted);
        }
        .footer-bottom a {
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 800;
            letter-spacing: 0.08em;
        }
        .footer-bottom a:hover {
            color: var(--text-main);
        }
    </style>
</head>
<body>

    <header class="site-header">
        <div class="header-brand">
            <h1>
                <a href="/" class="logo" aria-label="CHOCOZAP SECURITY">
                    <span class="logo-sq" aria-hidden="true"></span>
                    <span class="logo-name">CHOCOZAP</span>
                    <span class="logo-slash" aria-hidden="true">/</span>
                    <span class="logo-sub">SECURITY</span>
                </a>
            </h1>
        </div>
    </header>

    <div class="main-container">
        <div class="cyber-panel">
            <h2>ADMIN LOGIN // AUTHENTICATION</h2>
            <p style="font-size: 0.8rem; color: var(--text-muted); font-family: monospace; margin-bottom: 24px;">
                // COMMAND CENTER ACCESS REQUIRED
            </p>
            
            <div class="input-group">
                <label for="username">Admin ID</label>
                <input type="text" id="username" placeholder="admin" required>
            </div>

            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>

            <button type="button" class="cyber-btn" onclick="handleLogin()">AUTHENTICATE</button>
            <div id="errorMsg"></div>
        </div>
    </div>

    <footer class="site-footer">
        <div class="footer-inner">
            <div class="footer-logo">
                <a href="/" class="logo" aria-label="CHOCOZAP SECURITY">
                    <span class="logo-sq" aria-hidden="true"></span>
                    <span class="logo-name">CHOCOZAP</span>
                    <span class="logo-slash" aria-hidden="true">/</span>
                    <span class="logo-sub">SECURITY</span>
                </a>
            </div>

            <div class="footer-bottom">
                <div>&copy; 2026 CHOCOZAP SECURITY</div>
                <a href="#" onclick="window.scrollTo({top: 0, behavior: 'smooth'}); return false;">BACK TO TOP &uarr;</a>
            </div>
        </div>
    </footer>

    <script>
        function handleLogin() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('errorMsg');

            if (!username || !password) {
                errorMsg.innerText = "ERROR: ID AND PASSWORD REQUIRED.";
                return;
            }

            fetch('/api/admin/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: username, password: password })
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === "success") {
                    window.location.href = "/";
                } else {
                    errorMsg.innerText = "ACCESS DENIED: " + (data.message || "INVALID CREDENTIALS.");
                }
            })
            .catch(err => {
                errorMsg.innerText = "CRITICAL: NETWORK ERROR.";
                console.error(err);
            });
        }
    </script>
</body>
</html>
