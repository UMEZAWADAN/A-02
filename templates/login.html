<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>ログイン - CHOCOZAP</title>
    <style>
        :root {
            --surface-card: rgba(252, 251, 250, 0.92);
            --surface-alt: rgba(234, 229, 220, 0.7);
            --border-color: #ded7cb;
            --text-main: #332d29;
            --text-muted: #82786f;
            --radius-lg: 20px;
            --radius-sm: 10px;
            
            --font-logo: "Futura", "Century Gothic", -apple-system, sans-serif;
            --font-en: "Times New Roman", "YuMincho", "Hiragino Mincho ProN", serif;
            --font-jp: "Zen Maru Gothic", "Hiragino Maru Gothic Pro", "Yu Gothic Rounded", sans-serif;
        }

        body {
            font-family: var(--font-en);
            background-image: linear-gradient(rgba(30, 25, 22, 0.55), rgba(30, 25, 22, 0.55)), url('/static/bg.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: var(--text-main);
            margin: 0;
            padding-top: 80px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .site-header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 80px;
            background-color: transparent;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 48px;
            box-sizing: border-box;
            z-index: 1000;
            transition: background-color 0.4s ease, box-shadow 0.4s ease;
        }

        .site-header:hover {
            background-color: #ffffff;
            box-shadow: 0 4px 20px rgba(51, 45, 41, 0.1);
        }

        .header-logo {
            font-family: var(--font-logo);
            font-size: 1.4rem;
            font-weight: 300;
            letter-spacing: 0.25em;
            color: #ffffff;
            text-decoration: none;
            text-shadow: 0 1px 4px rgba(0,0,0,0.5);
            transition: color 0.4s ease, text-shadow 0.4s ease;
        }

        .site-header:hover .header-logo {
            color: var(--text-main);
            text-shadow: none;
        }

        .login-card {
            background: var(--surface-card);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: var(--radius-lg);
            padding: 48px 40px;
            max-width: 420px;
            width: 100%;
            margin: 60px auto;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
            text-align: center;
            box-sizing: border-box;
        }

        .login-card h2 {
            margin-top: 0;
            font-size: 1.6rem;
            font-weight: normal;
            letter-spacing: 0.1em;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .form-group label {
            display: block;
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 6px;
            font-weight: 600;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            box-sizing: border-box;
            font-size: 1rem;
            background: rgba(255, 255, 255, 0.8);
            color: var(--text-main);
            outline: none;
        }

        .btn {
            font-family: var(--font-jp);
            background: var(--text-main);
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: var(--radius-sm);
            font-weight: 500;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            text-align: center;
            box-sizing: border-box;
        }

        .jp-text { font-family: var(--font-jp); }

        .site-footer {
            margin-top: auto;
            width: 100%;
            background-color: transparent;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding: 40px 48px;
            box-sizing: border-box;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background-color 0.4s ease;
        }

        .site-footer:hover {
            background-color: #ffffff;
            border-top: 1px solid var(--border-color);
        }

        .footer-logo {
            font-family: var(--font-logo);
            font-size: 1.2rem;
            font-weight: 300;
            letter-spacing: 0.25em;
            color: #ffffff;
            text-decoration: none;
            transition: color 0.4s ease;
        }

        .site-footer:hover .footer-logo { color: var(--text-main); }
        .footer-copy { font-size: 0.78rem; color: rgba(255, 255, 255, 0.7); }
        .site-footer:hover .footer-copy { color: var(--text-muted); }
    </style>
</head>
<body>

    <header class="site-header">
        <a href="/login" class="header-logo">CHOCOZAP</a>
    </header>

    <div style="max-width: 1000px; width: 100%; padding: 0 20px; box-sizing: border-box; flex: 1;">
        <div class="login-card">
            <h2>MEMBER LOGIN</h2>
            <p class="jp-text" style="color: var(--text-muted); font-size: 0.85rem; margin-bottom: 24px;">ご登録のメールアドレスを入力してください</p>
            
            <form onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label class="jp-text" for="email-input">メールアドレス</label>
                    <input type="email" id="email-input" placeholder="example@email.com" required>
                </div>
        
                <div class="form-group">
                    <label class="jp-text" for="password-input">パスワード</label>
                    <input type="password" id="password-input" placeholder="••••••••" required>
                </div>

                <button type="submit" class="btn" style="width: 100%;">ログイン</button>
            </form>
            <p id="login-error" style="color: #b55232; font-size: 0.85rem; margin-top: 12px; display: none;"></p>

            <div style="margin-top: 24px; border-top: 1px solid var(--border-color); padding-top: 20px;">
                <a href="/api/start-register" class="btn" style="width: 100%; background: var(--surface-alt); color: var(--text-main); border: 1px solid var(--border-color);">新規会員登録はこちら</a>      
            </div>
        </div>
    </div>

    <footer class="site-footer">
        <a href="/login" class="footer-logo">CHOCOZAP</a>
        <div class="footer-copy">&copy; 2026 CHOCOZAP</div>
    </footer>

    <script>
        async function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('email-input').value;
            const password = document.getElementById('password-input').value;
            const errorEl = document.getElementById('login-error');
            errorEl.style.display = 'none';

            const res = await fetch('/api/member/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: email, password: password })
            });

            const data = await res.json();
            if (data.status === 'success') {
                window.location.href = '/portal';
            } else {
                errorEl.innerText = data.message || 'ログインに失敗しました。';
                errorEl.style.display = 'block';
            }
        }
    </script>
</body>
</html>
