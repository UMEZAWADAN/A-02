<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>会員管理 - ジム管理ダッシュボード</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 20px;
        }
        .nav-links {
            text-align: center;
            margin-bottom: 20px;
        }
        .nav-links a {
            background-color: #34495e;
            color: white;
            padding: 8px 16px;
            text-decoration: none;
            border-radius: 4px;
            font-size: 0.9rem;
            font-weight: bold;
        }
        .nav-links a:hover {
            background-color: #2c3e50;
        }
        .panel {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            max-width: 900px;
            margin: 0 auto;
            box-sizing: border-box;
        }
        .panel h2 {
            margin-top: 0;
            font-size: 1.2rem;
            border-bottom: 2px solid #2980b9;
            padding-bottom: 8px;
            color: #2980b9;
        }
        .members-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        .members-table th, .members-table td {
            padding: 10px 12px;
            border-bottom: 1px solid #ddd;
            text-align: left;
            font-size: 0.95rem;
        }
        .members-table th {
            background-color: #f8f9fa;
            color: #555;
        }
        .btn-delete {
            background-color: #e74c3c;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.85rem;
        }
        .btn-delete:hover {
            background-color: #c0392b;
        }
    </style>
</head>
<body>

    <h1>👥 ジム会員管理システム</h1>
    
    <div class="nav-links">
        <a href="/">← ライブ監視ダッシュボードへ戻る</a>
    </div>

    <div class="panel">
        <h2>登録会員一覧</h2>
        <table class="members-table">
            <thead>
                <tr>
                    <th>会員ID</th>
                    <th>お名前</th>
                    <th>メールアドレス</th>
                    <th>QRトークン</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody id="members-table-body">
                <tr>
                    <td colspan="5" style="text-align: center; color: #888; padding: 20px;">読み込み中...</td>
                </tr>
            </tbody>
        </table>
    </div>

    <script>
        async function fetchMembers() {
            try {
                const response = await fetch('/api/admin/members');
                const data = await response.json();
                const tbody = document.getElementById('members-table-body');
                tbody.innerHTML = '';

                if (data.members.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="5" style="text-align: center; color: #888; padding: 20px;">登録されている会員はいません。</td></tr>`;
                    return;
                }

                data.members.forEach(member => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td style="font-family: monospace; font-weight: bold;">${member.member_id}</td>
                        <td>${member.name}</td>
                        <td>${member.email}</td>
                        <td style="font-family: monospace; font-size: 0.8rem; color: #666;">${member.qr_token.substring(0, 15)}...</td>
                        <td><button class="btn-delete" onclick="deleteMember('${member.member_id}', '${member.name}')">削除</button></td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (err) {
                console.error("会員データの取得に失敗しました", err);
            }
        }

        async function deleteMember(memberId, memberName) {
            if (!confirm(`本当に「${memberName} (${memberId})」を削除しますか？`)) {
                return;
            }

            try {
                const response = await fetch(`/api/admin/members/${memberId}`, {
                    method: 'DELETE'
                });
                const result = await response.json();
                if (result.status === 'success') {
                    alert(result.message);
                    fetchMembers(); // 一覧を再読み込み
                } else {
                    alert(`エラー: ${result.message}`);
                }
            } catch (err) {
                alert("削除処理中に通信エラーが発生しました。");
            }
        }

        // ページ読み込み時に会員一覧を取得
        fetchMembers();
    </script>
</body>
</html>
