<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>MEMBER MANAGEMENT - CHOCOZAP SECURITY</title>
    <style>
        :root {
            --bg-color: #ffffff;
            --surface-card: #f7f7f9;
            --surface-alt: #eceef2;
            --border-color: #e4e4e9;
            --border-active: #D8FB54;
            
            --text-main: #0d0d0f;
            --text-muted: #71717a;
            
            --accent-lime: #D8FB54;
            --accent-lime-dark: #b5d432;
            --danger-color: #ff2a5f;
        }

        /* 1. ページ全体を縦方向のFlexboxにしてフッターを底に沈める */
        html, body {
            height: 100%;
            margin: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", YuGothic, "Meiryo", sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            padding-top: 160px; /* 固定ヘッダー分の余白 */
            padding-left: 20px;
            padding-right: 20px;
            box-sizing: border-box;
            letter-spacing: -0.02em;
            -webkit-font-smoothing: antialiased;
            
            display: flex;
            flex-direction: column;
        }

        /* 2. メインコンテンツが少ない時でもフッターを押し下げるラッパー */
        .page-content {
            flex: 1;
        }

        /* 共通のリキッドグラスヘッダー */
        .site-header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(40px) saturate(250%);
            -webkit-backdrop-filter: blur(40px) saturate(250%);
            border-bottom: 1px solid rgba(228, 228, 233, 0.15);
            padding: 20px 20px 16px 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header-brand h1 {
            font-size: 2.4rem;
            font-weight: 900;
            text-transform: uppercase;
            margin: 0 0 12px 0;
            letter-spacing: 0.08em;
            text-align: center;
            font-family: Impact, -apple-system, BlinkMacSystemFont, sans-serif;
            
            color: transparent;
            -webkit-text-stroke: 1.5px var(--text-main);
        }

        .header-brand h1 a {
            color: inherit;
            text-decoration: none;
            transition: color 0.3s ease;
        }
        .header-brand h1 a:hover {
            color: var(--accent-lime);
        }

        .nav-container {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .nav-btn {
            background: rgba(236, 238, 242, 0.3);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            color: var(--text-main);
            padding: 8px 20px;
            text-decoration: none;
            border-radius: 2px;
            font-size: 0.75rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            border: 1px solid rgba(228, 228, 233, 0.3);
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
            font-family: monospace;
            position: relative;
        }
        .nav-btn:hover {
            border-color: var(--text-main);
            background: rgba(255, 255, 255, 0.7);
        }
        .nav-btn::after {
            content: '';
            position: absolute;
            bottom: 4px;
            left: 20px;
            right: 20px;
            height: 2px;
            background-color: transparent;
            transition: background-color 0.2s ease;
        }
        .nav-btn:hover::after {
            background-color: var(--accent-lime);
        }

        /* 🆕 ログアウトボタン用の特別スタイル */
        .nav-btn-logout {
            border-color: rgba(255, 42, 95, 0.4);
            color: var(--danger-color);
        }
        .nav-btn-logout:hover {
            background: rgba(255, 42, 95, 0.1);
            border-color: var(--danger-color);
        }
        .nav-btn-logout:hover::after {
            background-color: var(--danger-color);
        }

        /* 共通パネル・テーブル */
        .cyber-panel-full {
            background: var(--surface-card);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 24px;
            max-width: 1024px;
            margin: 0 auto 40px auto;
            box-sizing: border-box;
            box-shadow: 0 4px 20px rgba(0,0,0,0.02);
        }

        .cyber-panel-full h2 {
            margin-top: 0;
            font-size: 0.9rem;
            font-weight: 900;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--text-main);
            border-bottom: 2px solid var(--text-main);
            padding-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: monospace;
        }

        .cyber-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        .cyber-table th, .cyber-table td {
            padding: 12px 10px;
            border-bottom: 1px solid var(--border-color);
            font-size: 0.9rem;
            text-align: left;
        }
        .cyber-table th {
            background: var(--surface-alt);
            color: var(--text-muted);
            font-size: 0.75rem;
            font-family: monospace;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            text-align: center;
            font-weight: 800;
        }
        .cyber-table td {
            text-align: center;
            color: var(--text-main);
        }

        .btn-delete {
            background: #ffe6eb;
            color: var(--danger-color);
            border: 1px solid #ffadb8;
            padding: 4px 12px;
            border-radius: 2px;
            cursor: pointer;
            font-weight: 800;
            font-size: 0.75rem;
            font-family: monospace;
            text-transform: uppercase;
            transition: all 0.2s ease;
        }
        .btn-delete:hover {
            background: var(--danger-color);
            color: #fff;
        }

        .btn-detail {
            background: var(--surface-alt);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 4px 12px;
            border-radius: 2px;
            cursor: pointer;
            font-weight: 800;
            font-size: 0.75rem;
            font-family: monospace;
            text-transform: uppercase;
            transition: all 0.2s ease;
        }
        .btn-detail:hover {
            background: var(--accent-lime);
            border-color: var(--accent-lime-dark);
        }

        /* 詳細モーダル */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 2000;
            background: rgba(13, 13, 15, 0.45);
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-sizing: border-box;
        }
        .modal-overlay.open { display: flex; }
        .modal {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            width: 100%;
            max-width: 760px;
            max-height: 85vh;
            overflow-y: auto;
            padding: 24px;
            box-sizing: border-box;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            text-align: left;
        }
        .modal-head {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            border-bottom: 2px solid var(--text-main);
            padding-bottom: 10px;
            margin-bottom: 16px;
        }
        .modal-head h3 { margin: 0; font-size: 1.1rem; }
        .modal-head .sub { font-family: monospace; font-size: 0.8rem; color: var(--text-muted); margin-top: 4px; }
        .modal-close {
            background: none;
            border: none;
            font-size: 1.6rem;
            line-height: 1;
            cursor: pointer;
            color: var(--text-muted);
        }
        .modal-close:hover { color: var(--text-main); }
        .detail-info { font-size: 0.9rem; line-height: 1.8; margin-bottom: 16px; }
        .detail-info b { font-family: monospace; font-size: 0.75rem; color: var(--text-muted); display: inline-block; width: 110px; }
        .stat-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 10px;
            margin-bottom: 20px;
        }
        .stat-card {
            background: var(--surface-card);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 12px;
            text-align: center;
        }
        .stat-card .label { font-family: monospace; font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.06em; }
        .stat-card .value { font-size: 1.1rem; font-weight: 800; margin-top: 6px; word-break: break-all; }
        .detail-section-title {
            font-family: monospace;
            font-size: 0.8rem;
            font-weight: 900;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            margin: 20px 0 6px 0;
        }
        .detail-muted { color: var(--text-muted); font-size: 0.85rem; }
        .tag-over { color: var(--danger-color); font-weight: 800; }
        .tag-badge {
            display: inline-block;
            background: var(--accent-lime);
            padding: 1px 8px;
            border-radius: 2px;
            font-weight: 800;
            font-size: 0.8rem;
        }

        /* フッター：ナビ + アウトライン文字のロゴ + 著作権 */
        .site-footer {
            margin-top: auto;
            margin-left: -20px;
            margin-right: -20px;
            padding: 32px 20px 20px 20px;
            border-top: 1px solid var(--text-main);
            background: var(--bg-color);
            box-sizing: border-box;
        }

        .footer-inner {
            max-width: 1024px;
            margin: 0 auto;
        }

        .footer-nav {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px 28px;
            font-family: monospace;
            font-size: 0.75rem;
            font-weight: 800;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }
        .footer-nav a {
            color: var(--text-main);
            text-decoration: none;
            padding: 4px 0;
            border-bottom: 2px solid transparent;
            transition: border-color 0.2s ease;
        }
        .footer-nav a:hover,
        .footer-nav a.current {
            border-bottom-color: var(--accent-lime);
        }
        .footer-nav a.logout {
            color: var(--danger-color);
        }
        .footer-nav a.logout:hover {
            border-bottom-color: var(--danger-color);
        }

        .footer-wordmark {
            display: block;
            max-width: 380px;
            margin: 28px auto 12px auto;
            text-decoration: none;
        }
        .footer-wordmark svg {
            display: block;
            width: 100%;
            height: auto;
        }
        .footer-wordmark text {
            font-family: Impact, -apple-system, BlinkMacSystemFont, sans-serif;
            font-weight: 900;
            fill: transparent;
            stroke: var(--text-main);
            stroke-width: 3;
            transition: fill 0.3s ease;
        }
        .footer-wordmark:hover text {
            fill: var(--accent-lime);
        }

        .footer-bottom {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            padding-top: 12px;
            border-top: 1px solid var(--border-color);
            font-family: monospace;
            font-size: 0.75rem;
            color: var(--text-muted);
        }
        .footer-bottom a {
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 800;
            letter-spacing: 0.08em;
        }
        .footer-bottom a:hover {
            color: var(--text-main);
        }
    </style>
</head>
<body>

    <header class="site-header">
        <div class="header-brand">
            <h1><a href="/" class="brand-link" aria-label="CHOCOZAP SECURITY ホームへ">CHOCOZAP SECURITY</a></h1>
        </div>
        <nav class="nav-container">
            <a href="/" class="nav-btn">&larr; LIVE MONITOR</a>
            <a href="/admin/logs" class="nav-btn">ACCESS LOGS</a>
            <!-- 🆕 追加したログアウトボタン -->
            <a href="/admin/logout" class="nav-btn nav-btn-logout">LOGOUT</a>
        </nav>
    </header>

    <!-- メインコンテンツを包むラッパー -->
    <div class="page-content">
        <div class="cyber-panel-full" style="margin-top: 20px;">
            <h2>REGISTERED MEMBERS MANAGEMENT</h2>
            <table class="cyber-table">
                <thead>
                    <tr>
                        <th>Member ID</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>QR Token</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="members-table-body">
                    <tr>
                        <td colspan="5" style="color: var(--text-muted); padding: 20px;">LOADING DATABASE...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- 会員詳細モーダル -->
    <div class="modal-overlay" id="detail-overlay">
        <div class="modal" role="dialog" aria-modal="true" aria-labelledby="detail-title">
            <div class="modal-head">
                <div>
                    <h3 id="detail-title">LOADING...</h3>
                    <div class="sub" id="detail-sub"></div>
                </div>
                <button class="modal-close" id="detail-close" aria-label="閉じる">&times;</button>
            </div>
            <div id="detail-body"></div>
        </div>
    </div>

    <footer class="site-footer">
        <div class="footer-inner">
            <nav class="footer-nav">
                <a href="/">LIVE MONITOR</a>
                <a href="/admin/logs">ACCESS LOGS</a>
                <a href="/admin/members" class="current" aria-current="page">MEMBERS</a>
                <a href="/admin/logout" class="logout">LOGOUT</a>
            </nav>

            <a class="footer-wordmark" href="/" aria-label="CHOCOZAP SECURITY">
                <svg viewBox="0 0 1000 118" aria-hidden="true" preserveAspectRatio="xMidYMid meet">
                    <text x="0" y="112" font-size="130" textLength="1000" lengthAdjust="spacingAndGlyphs">CHOCOZAP SECURITY</text>
                </svg>
            </a>

            <div class="footer-bottom">
                <div>&copy; 2026 CHOCOZAP SECURITY</div>
                <a href="#" onclick="window.scrollTo({top: 0, behavior: 'smooth'}); return false;">BACK TO TOP &uarr;</a>
            </div>
        </div>
    </footer>

    <script>
        // 画面に出す文字列は必ずエスケープする（登録時の名前などに含まれるHTMLを実行させない）
        function esc(s) {
            return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        }

        function fmtDuration(sec) {
            sec = Math.round(sec || 0);
            const m = Math.floor(sec / 60), s = sec % 60;
            return m > 0 ? `${m}分${s}秒` : `${s}秒`;
        }

        async function fetchMembers() {
            try {
                const response = await fetch('/api/admin/members');
                const data = await response.json();
                const tbody = document.getElementById('members-table-body');
                tbody.innerHTML = '';

                if (data.members.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="5" style="text-align: center; color: var(--text-muted); padding: 20px;">登録されている会員はいません。</td></tr>`;
                    return;
                }

                data.members.forEach(member => {
                    const tr = document.createElement('tr');
                    const cells = [
                        [member.member_id, 'font-family: monospace; font-weight: 700;'],
                        [member.name, 'font-weight: 700;'],
                        [member.email, 'font-family: monospace;'],
                        [(member.qr_token || '').substring(0, 15) + '...', 'font-family: monospace; font-size: 0.8rem; color: var(--text-muted);'],
                    ];
                    cells.forEach(([text, style]) => {
                        const td = document.createElement('td');
                        td.style.cssText = style;
                        td.textContent = text;
                        tr.appendChild(td);
                    });

                    const actionTd = document.createElement('td');
                    const detailBtn = document.createElement('button');
                    detailBtn.className = 'btn-detail';
                    detailBtn.textContent = 'DETAIL';
                    detailBtn.addEventListener('click', () => openDetail(member.member_id));
                    const deleteBtn = document.createElement('button');
                    deleteBtn.className = 'btn-delete';
                    deleteBtn.textContent = 'DELETE';
                    deleteBtn.addEventListener('click', () => deleteMember(member.member_id, member.name));
                    actionTd.append(detailBtn, ' ', deleteBtn);
                    tr.appendChild(actionTd);

                    tbody.appendChild(tr);
                });
            } catch (err) {
                console.error("会員データの取得に失敗しました", err);
            }
        }

        // ---- 会員の詳細（履歴）モーダル ----
        const overlay = document.getElementById('detail-overlay');

        function closeDetail() { overlay.classList.remove('open'); }
        document.getElementById('detail-close').addEventListener('click', closeDetail);
        overlay.addEventListener('click', (e) => { if (e.target === overlay) closeDetail(); });
        document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeDetail(); });

        async function openDetail(memberId) {
            const body = document.getElementById('detail-body');
            document.getElementById('detail-title').textContent = 'LOADING...';
            document.getElementById('detail-sub').textContent = '';
            body.innerHTML = '<p class="detail-muted">読み込み中...</p>';
            overlay.classList.add('open');

            try {
                const response = await fetch(`/api/admin/members/${encodeURIComponent(memberId)}/detail`);
                if (response.status === 401) {
                    window.location.href = '/admin/login';
                    return;
                }
                const d = await response.json();
                if (d.status !== 'success') {
                    document.getElementById('detail-title').textContent = 'ERROR';
                    body.innerHTML = `<p>${esc(d.message)}</p>`;
                    return;
                }
                renderDetail(d);
            } catch (err) {
                document.getElementById('detail-title').textContent = 'ERROR';
                body.innerHTML = '<p>履歴の取得に失敗しました。</p>';
            }
        }

        function renderDetail(d) {
            document.getElementById('detail-title').textContent = d.member.name;
            document.getElementById('detail-sub').textContent = d.member.member_id;

            let currentText = '<span class="detail-muted">利用していません</span>';
            if (d.current) {
                const over = d.current.status === 'overtime' ? ' <span class="tag-over">（時間超過）</span>' : '';
                currentText = `<span class="tag-badge">利用中</span> ${esc(d.current.machine)} / ${esc(fmtDuration(d.current.duration))}${over}`;
            }

            const usageRows = d.usages.length === 0
                ? '<tr><td colspan="4" class="detail-muted" style="padding: 14px;">利用履歴はまだありません。</td></tr>'
                : d.usages.map(u => `
                    <tr>
                        <td>${esc(u.machine)}</td>
                        <td style="font-family: monospace;">${esc(u.start_time)}</td>
                        <td>${esc(fmtDuration(u.duration))}</td>
                        <td>${u.overtime ? '<span class="tag-over">超過</span>' : 'OK'}</td>
                    </tr>`).join('');

            const visitRows = d.visits.length === 0
                ? '<tr><td style="padding: 14px;" class="detail-muted">入館履歴はまだありません。</td></tr>'
                : d.visits.map(t => `<tr><td style="font-family: monospace;">${esc(t)}</td></tr>`).join('');

            document.getElementById('detail-body').innerHTML = `
                <div class="detail-info">
                    <div><b>EMAIL</b>${esc(d.member.email)}</div>
                    <div><b>FACE DATA</b>${d.member.has_face ? '登録済み' : '<span class="tag-over">未登録</span>'}</div>
                    <div><b>NOW</b>${currentText}</div>
                </div>

                <div class="stat-grid">
                    <div class="stat-card"><div class="label">Visits</div><div class="value">${esc(d.summary.visit_count)} 回</div></div>
                    <div class="stat-card"><div class="label">Last visit</div><div class="value" style="font-size: 0.85rem;">${esc(d.summary.last_visit || '-')}</div></div>
                    <div class="stat-card"><div class="label">Machine uses</div><div class="value">${esc(d.summary.usage_count)} 回</div></div>
                    <div class="stat-card"><div class="label">Total time</div><div class="value">${esc(fmtDuration(d.summary.total_usage_seconds))}</div></div>
                </div>

                <div class="detail-section-title">Machine usage history (latest 50)</div>
                <table class="cyber-table">
                    <thead><tr><th>Machine</th><th>Start</th><th>Duration</th><th>Status</th></tr></thead>
                    <tbody>${usageRows}</tbody>
                </table>

                <div class="detail-section-title">Entry history (latest 50)</div>
                <table class="cyber-table">
                    <thead><tr><th>Date / Time</th></tr></thead>
                    <tbody>${visitRows}</tbody>
                </table>

                <p class="detail-muted" style="margin-top: 16px;">
                    ※ 入館履歴は、QRと顔の認証に成功した記録だけです。警告つきの記録や退館は、個人を特定できないため含まれません。
                </p>`;
        }

        async function deleteMember(memberId, memberName) {
            if (!confirm(`本当に「${memberName} (${memberId})」を削除しますか？`)) {
                return;
            }

            try {
                const response = await fetch(`/api/admin/members/${memberId}`, {
                    method: 'DELETE'
                });
                const result = await response.json();
                if (result.status === 'success') {
                    alert(result.message);
                    fetchMembers();
                } else {
                    alert(`エラー: ${result.message}`);
                }
            } catch (err) {
                alert("削除処理中に通信エラーが発生しました。");
            }
        }

        fetchMembers();
    </script>
</body>
</html>
