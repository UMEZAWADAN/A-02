<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>ACCESS LOGS - CHOCOZAP SECURITY</title>
    <style>
        :root {
            --bg-color: #ffffff;
            --surface-card: #f7f7f9;
            --surface-alt: #eceef2;
            --border-color: #e4e4e9;
            --border-active: #D8FB54;
            
            --text-main: #0d0d0f;
            --text-muted: #71717a;
            
            --accent-lime: #D8FB54;
            --accent-lime-dark: #b5d432;
            --danger-color: #ff2a5f;
        }

        /* ページ全体を縦方向のFlexboxにしてフッターを底に沈める */
        html, body {
            height: 100%;
            margin: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", YuGothic, "Meiryo", sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            padding-top: 160px; /* 固定ヘッダー分の余白 */
            padding-left: 20px;
            padding-right: 20px;
            box-sizing: border-box;
            letter-spacing: -0.02em;
            -webkit-font-smoothing: antialiased;
            
            display: flex;
            flex-direction: column;
        }

        /* メインコンテンツが少なくてもフッターを押し下げるラッパー */
        .page-content {
            flex: 1;
        }

        /* 共通のリキッドグラスヘッダー */
        .site-header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(40px) saturate(250%);
            -webkit-backdrop-filter: blur(40px) saturate(250%);
            border-bottom: 1px solid rgba(228, 228, 233, 0.15);
            padding: 20px 20px 16px 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header-brand h1 {
            font-size: 2.4rem;
            font-weight: 900;
            text-transform: uppercase;
            margin: 0 0 12px 0;
            letter-spacing: 0.08em;
            text-align: center;
            font-family: Impact, -apple-system, BlinkMacSystemFont, sans-serif;
            
            color: transparent;
            -webkit-text-stroke: 1.5px var(--text-main);
        }

        .header-brand h1 a {
            color: inherit;
            text-decoration: none;
            transition: color 0.3s ease;
        }
        .header-brand h1 a:hover {
            color: var(--accent-lime);
        }

        .nav-container {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .nav-btn {
            background: rgba(236, 238, 242, 0.3);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            color: var(--text-main);
            padding: 8px 20px;
            text-decoration: none;
            border-radius: 2px;
            font-size: 0.75rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            border: 1px solid rgba(228, 228, 233, 0.3);
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
            font-family: monospace;
            position: relative;
        }
        .nav-btn:hover {
            border-color: var(--text-main);
            background: rgba(255, 255, 255, 0.7);
        }
        .nav-btn::after {
            content: '';
            position: absolute;
            bottom: 4px;
            left: 20px;
            right: 20px;
            height: 2px;
            background-color: transparent;
            transition: background-color 0.2s ease;
        }
        .nav-btn:hover::after {
            background-color: var(--accent-lime);
        }

        /* 🆕 ログアウトボタン用の特別スタイル */
        .nav-btn-logout {
            border-color: rgba(255, 42, 95, 0.4);
            color: var(--danger-color);
        }
        .nav-btn-logout:hover {
            background: rgba(255, 42, 95, 0.1);
            border-color: var(--danger-color);
        }
        .nav-btn-logout:hover::after {
            background-color: var(--danger-color);
        }

        /* 共通パネル・テーブル */
        .cyber-panel-full {
            background: var(--surface-card);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 24px;
            max-width: 1024px;
            margin: 0 auto 40px auto;
            box-sizing: border-box;
            box-shadow: 0 4px 20px rgba(0,0,0,0.02);
        }

        .cyber-panel-full h2 {
            margin-top: 0;
            font-size: 0.9rem;
            font-weight: 900;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--text-main);
            border-bottom: 2px solid var(--text-main);
            padding-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: monospace;
        }

        .cyber-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        .cyber-table th, .cyber-table td {
            padding: 12px 10px;
            border-bottom: 1px solid var(--border-color);
            font-size: 0.9rem;
            text-align: left;
        }
        .cyber-table th {
            background: var(--surface-alt);
            color: var(--text-muted);
            font-size: 0.75rem;
            font-family: monospace;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            text-align: center;
            font-weight: 800;
        }
        .cyber-table td {
            text-align: center;
            color: var(--text-main);
        }

        /* ステータスバッジのデザイン調整 */
        .badge {
            padding: 3px 10px;
            border-radius: 50px;
            font-size: 0.7rem;
            font-weight: 800;
            font-family: monospace;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            display: inline-block;
        }
        .badge-in { background: #f0fcd4; color: #3b6b00; border: 1px solid var(--accent-lime); }
        .badge-out { background: var(--surface-alt); color: var(--text-muted); border: 1px solid var(--border-color); }
        .badge-alert { background: #ffe6eb; color: var(--danger-color); border: 1px solid #ffadb8; border-radius: 2px; }
        .badge-normal { background: #f0fcd4; color: #3b6b00; border: 1px solid var(--accent-lime); }

        .badge-active { background: var(--accent-lime); color: var(--text-main); border: 1px solid var(--accent-lime-dark); }
        .badge-type-gate { background: var(--surface-alt); color: var(--text-main); border: 1px solid var(--border-color); border-radius: 2px; }
        .badge-type-machine { background: #fff; color: var(--text-main); border: 1px solid var(--text-main); border-radius: 2px; }
        .row-alert td { background: #fff5f7; }
        .muted { color: var(--text-muted); font-family: monospace; font-size: 0.8rem; }

        .filter-bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 4px 0 8px 0; }
        .filter-btn {
            background: var(--surface-alt);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 5px 14px;
            border-radius: 2px;
            cursor: pointer;
            font-weight: 800;
            font-size: 0.75rem;
            font-family: monospace;
            letter-spacing: 0.06em;
        }
        .filter-btn:hover { border-color: var(--text-main); }
        .filter-btn.active { background: var(--text-main); color: #fff; border-color: var(--text-main); }
        .updated-at { margin-left: auto; font-family: monospace; font-size: 0.75rem; color: var(--text-muted); }

        .btn-detail {
            background: var(--surface-alt);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 4px 12px;
            border-radius: 2px;
            cursor: pointer;
            font-weight: 800;
            font-size: 0.75rem;
            font-family: monospace;
            text-transform: uppercase;
            transition: all 0.2s ease;
        }
        .btn-detail:hover { background: var(--accent-lime); border-color: var(--accent-lime-dark); }

        /* 詳細モーダル */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 2000;
            background: rgba(13, 13, 15, 0.45);
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-sizing: border-box;
        }
        .modal-overlay.open { display: flex; }
        .modal {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            width: 100%;
            max-width: 640px;
            max-height: 85vh;
            overflow-y: auto;
            padding: 24px;
            box-sizing: border-box;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            text-align: left;
        }
        .modal-head {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            border-bottom: 2px solid var(--text-main);
            padding-bottom: 10px;
            margin-bottom: 8px;
        }
        .modal-head h3 { margin: 0; font-size: 1.05rem; }
        .modal-close { background: none; border: none; font-size: 1.6rem; line-height: 1; cursor: pointer; color: var(--text-muted); }
        .modal-close:hover { color: var(--text-main); }
        .field-row { display: flex; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--border-color); font-size: 0.9rem; }
        .field-row .k { width: 130px; flex-shrink: 0; font-family: monospace; font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; padding-top: 2px; }
        .field-row .v { flex: 1; word-break: break-word; }
        .tone-danger { color: var(--danger-color); font-weight: 800; }
        .tone-ok { color: #3b6b00; font-weight: 800; }
        .detail-section-title { font-family: monospace; font-size: 0.8rem; font-weight: 900; letter-spacing: 0.08em; text-transform: uppercase; margin: 22px 0 4px 0; }
        .detail-muted { color: var(--text-muted); font-size: 0.85rem; }

        /* フッター：ナビ + アウトライン文字のロゴ + 著作権 */
        .site-footer {
            margin-top: auto;
            margin-left: -20px;
            margin-right: -20px;
            padding: 32px 20px 20px 20px;
            border-top: 1px solid var(--text-main);
            background: var(--bg-color);
            box-sizing: border-box;
        }

        .footer-inner {
            max-width: 1024px;
            margin: 0 auto;
        }

        .footer-nav {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px 28px;
            font-family: monospace;
            font-size: 0.75rem;
            font-weight: 800;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }
        .footer-nav a {
            color: var(--text-main);
            text-decoration: none;
            padding: 4px 0;
            border-bottom: 2px solid transparent;
            transition: border-color 0.2s ease;
        }
        .footer-nav a:hover,
        .footer-nav a.current {
            border-bottom-color: var(--accent-lime);
        }
        .footer-nav a.logout {
            color: var(--danger-color);
        }
        .footer-nav a.logout:hover {
            border-bottom-color: var(--danger-color);
        }

        .footer-wordmark {
            display: block;
            max-width: 380px;
            margin: 28px auto 12px auto;
            text-decoration: none;
        }
        .footer-wordmark svg {
            display: block;
            width: 100%;
            height: auto;
        }
        .footer-wordmark text {
            font-family: Impact, -apple-system, BlinkMacSystemFont, sans-serif;
            font-weight: 900;
            fill: transparent;
            stroke: var(--text-main);
            stroke-width: 3;
            transition: fill 0.3s ease;
        }
        .footer-wordmark:hover text {
            fill: var(--accent-lime);
        }

        .footer-bottom {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            padding-top: 12px;
            border-top: 1px solid var(--border-color);
            font-family: monospace;
            font-size: 0.75rem;
            color: var(--text-muted);
        }
        .footer-bottom a {
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 800;
            letter-spacing: 0.08em;
        }
        .footer-bottom a:hover {
            color: var(--text-main);
        }
    </style>
</head>
<body>

    <header class="site-header">
        <div class="header-brand">
            <h1><a href="/" class="brand-link" aria-label="CHOCOZAP SECURITY ホームへ">CHOCOZAP <span>SECURITY</span></a></h1>
        </div>
        <nav class="nav-container">
            <a href="/" class="nav-btn">HOME</a>
            <a href="/live" class="nav-btn">LIVE MONITOR</a>
            <a href="/admin/logs" class="nav-btn" style="border-color: var(--text-main);">ACCESS LOGS</a>
            <a href="/admin/members" class="nav-btn">MEMBERS</a>
            <a href="/admin/logout" class="nav-btn nav-btn-logout">LOGOUT</a>
        </nav>
    </header>

    <div class="page-content">
        <div class="cyber-panel-full" style="margin-top: 20px;">
            <h2>ACCESS & SECURITY LOGS (LAST 100)</h2>
            <div class="filter-bar">
                <button class="filter-btn active" data-filter="all">ALL</button>
                <button class="filter-btn" data-filter="gate">GATE (入退館)</button>
                <button class="filter-btn" data-filter="machine">MACHINE (マシン占有)</button>
                <span class="updated-at" id="updated-at"></span>
            </div>
            <table class="cyber-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Timestamp</th>
                        <th>Type</th>
                        <th>Event</th>
                        <th>Member</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="logs-table-body">
                    <tr>
                        <td colspan="7" style="color: var(--text-muted); padding: 20px;">WAITING FOR DATA STREAM...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- ログ詳細モーダル -->
    <div class="modal-overlay" id="detail-overlay">
        <div class="modal" role="dialog" aria-modal="true" aria-labelledby="detail-title">
            <div class="modal-head">
                <h3 id="detail-title">LOADING...</h3>
                <button class="modal-close" id="detail-close" aria-label="閉じる">&times;</button>
            </div>
            <div id="detail-body"></div>
        </div>
    </div>

    <footer class="site-footer">
        <div class="footer-inner">
            <nav class="footer-nav">
                <a href="/">HOME</a>
                <a href="/live">LIVE MONITOR</a>
                <a href="/admin/logs" class="current" aria-current="page">ACCESS LOGS</a>
                <a href="/admin/members">MEMBERS</a>
                <a href="/admin/logout" class="logout">LOGOUT</a>
            </nav>

            <a class="footer-wordmark" href="/" aria-label="CHOCOZAP SECURITY">
                <svg viewBox="0 0 1000 118" aria-hidden="true" preserveAspectRatio="xMidYMid meet">
                    <text x="0" y="112" font-size="130" textLength="1000" lengthAdjust="spacingAndGlyphs">CHOCOZAP SECURITY</text>
                </svg>
            </a>

            <div class="footer-bottom">
                <div>&copy; 2026 CHOCOZAP SECURITY</div>
                <a href="#" onclick="window.scrollTo({top: 0, behavior: 'smooth'}); return false;">BACK TO TOP &uarr;</a>
            </div>
        </div>
    </footer>

    <script>
        let allLogs = [];
        let currentFilter = 'all';
        let lastSignature = '';

        function esc(s) {
            return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        }

        function fmtDuration(sec) {
            sec = Math.round(sec || 0);
            const m = Math.floor(sec / 60), s = sec % 60;
            return m > 0 ? `${m}分${s}秒` : `${s}秒`;
        }

        const STATUS_BADGES = {
            alert:    ['badge-alert',  'ALERT'],
            normal:   ['badge-normal', 'NORMAL'],
            overtime: ['badge-alert',  'OVERTIME'],
            active:   ['badge-active', 'IN USE'],
        };

        function renderLogs() {
            const tbody = document.getElementById('logs-table-body');
            tbody.innerHTML = '';
            const logs = allLogs.filter(l => currentFilter === 'all' || l.type === currentFilter);

            if (logs.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" style="color: var(--text-muted); padding: 20px;">記録されているログはありません。</td></tr>`;
                return;
            }

            logs.forEach(log => {
                const tr = document.createElement('tr');
                if (log.status === 'alert' || log.status === 'overtime') tr.className = 'row-alert';

                const typeBadge = log.type === 'gate'
                    ? '<span class="badge badge-type-gate">GATE</span>'
                    : '<span class="badge badge-type-machine">MACHINE</span>';

                let eventCell;
                if (log.type === 'gate') {
                    eventCell = log.event === 'IN'
                        ? '<span class="badge badge-in">IN</span>'
                        : '<span class="badge badge-out">OUT</span>';
                } else {
                    eventCell = `${esc(log.event)} <span class="muted">${esc(fmtDuration(log.duration))}</span>`;
                }

                const [badgeClass, badgeText] = STATUS_BADGES[log.status] || STATUS_BADGES.normal;

                tr.innerHTML = `
                    <td style="color: var(--text-muted); font-family: monospace;">${esc(log.display_id)}</td>
                    <td style="color: var(--text-muted); font-family: monospace; font-size: 0.85rem;">${esc(log.timestamp)}</td>
                    <td>${typeBadge}</td>
                    <td>${eventCell}</td>
                    <td style="font-family: monospace; font-weight: 700;">${esc(log.member)}</td>
                    <td><span class="badge ${badgeClass}">${badgeText}</span></td>
                `;
                const actionTd = document.createElement('td');
                const btn = document.createElement('button');
                btn.className = 'btn-detail';
                btn.textContent = 'DETAIL';
                btn.addEventListener('click', () => openDetail(log.kind, log.ref));
                actionTd.appendChild(btn);
                tr.appendChild(actionTd);
                tbody.appendChild(tr);
            });
        }

        async function fetchLogs() {
            try {
                const response = await fetch('/api/admin/logs');
                if (response.status === 401) {
                    window.location.href = '/admin/login';
                    return;
                }
                const data = await response.json();
                document.getElementById('updated-at').textContent =
                    'UPDATED ' + new Date().toLocaleTimeString('ja-JP');
                const signature = JSON.stringify(data.logs);
                if (signature === lastSignature) return;
                lastSignature = signature;
                allLogs = data.logs;
                renderLogs();
            } catch (err) {
                console.error("ログデータの取得に失敗しました", err);
            }
        }

        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                currentFilter = btn.dataset.filter;
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.toggle('active', b === btn));
                renderLogs();
            });
        });

        const overlay = document.getElementById('detail-overlay');
        function closeDetail() { overlay.classList.remove('open'); }
        document.getElementById('detail-close').addEventListener('click', closeDetail);
        overlay.addEventListener('click', (e) => { if (e.target === overlay) closeDetail(); });
        document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeDetail(); });

        async function openDetail(kind, ref) {
            const body = document.getElementById('detail-body');
            document.getElementById('detail-title').textContent = 'LOADING...';
            body.innerHTML = '<p class="detail-muted">読み込み中...</p>';
            overlay.classList.add('open');

            try {
                const response = await fetch(`/api/admin/logs/${encodeURIComponent(kind)}/${encodeURIComponent(ref)}`);
                if (response.status === 401) {
                    window.location.href = '/admin/login';
                    return;
                }
                const d = await response.json();
                if (d.status !== 'success') {
                    document.getElementById('detail-title').textContent = 'ERROR';
                    body.innerHTML = `<p>${esc(d.message)}</p>`;
                    return;
                }
                renderDetail(d);
            } catch (err) {
                document.getElementById('detail-title').textContent = 'ERROR';
                body.innerHTML = '<p>詳細の取得に失敗しました。</p>';
            }
        }

        function renderDetail(d) {
            document.getElementById('detail-title').textContent = d.title;

            const fieldRows = d.fields.map(f => `
                <div class="field-row">
                    <div class="k">${esc(f.label)}</div>
                    <div class="v ${f.tone ? 'tone-' + esc(f.tone) : ''}">${esc(f.value)}</div>
                </div>`).join('');

            let memberBlock;
            if (d.member) {
                const m = d.member;
                memberBlock = `
                    <div class="detail-section-title">Member</div>
                    <div class="field-row"><div class="k">Name</div><div class="v">${esc(m.name)} <span class="muted">${esc(m.member_id)}</span></div></div>
                    <div class="field-row"><div class="k">Email</div><div class="v">${esc(m.email)}</div></div>
                    <div class="field-row"><div class="k">Face data</div><div class="v">${m.has_face ? '登録済み' : '<span class="tone-danger">未登録</span>'}</div></div>
                    <div class="field-row"><div class="k">Visits</div><div class="v">${esc(m.visit_count)} 回（最終: ${esc(m.last_visit || '-')}）</div></div>
                    <div class="field-row"><div class="k">Machine uses</div><div class="v">${esc(m.usage_count)} 回 / 合計 ${esc(fmtDuration(m.total_usage_seconds))}</div></div>`;
            } else {
                memberBlock = `
                    <div class="detail-section-title">Member</div>
                    <p class="detail-muted">会員を特定できていないログ、または会員が削除済みです。</p>`;
            }

            document.getElementById('detail-body').innerHTML = fieldRows + memberBlock;
        }

        fetchLogs();
        setInterval(fetchLogs, 5000);
    </script>
</body>
</html>
