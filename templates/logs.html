<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>入退館・セキュリティログ - ジム管理ダッシュボード</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 20px;
        }
        .nav-links {
            text-align: center;
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        .nav-links a {
            background-color: #34495e;
            color: white;
            padding: 8px 16px;
            text-decoration: none;
            border-radius: 4px;
            font-size: 0.9rem;
            font-weight: bold;
        }
        .nav-links a:hover {
            background-color: #2c3e50;
        }
        .panel {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            max-width: 900px;
            margin: 0 auto;
            box-sizing: border-box;
        }
        .panel h2 {
            margin-top: 0;
            font-size: 1.2rem;
            border-bottom: 2px solid #2ecc71;
            padding-bottom: 8px;
            color: #27ae60;
        }
        .logs-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        .logs-table th, .logs-table td {
            padding: 10px 12px;
            border-bottom: 1px solid #ddd;
            text-align: left;
            font-size: 0.95rem;
        }
        .logs-table th {
            background-color: #f8f9fa;
            color: #555;
            text-align: center;
        }
        .logs-table td {
            text-align: center;
        }
        .badge {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: bold;
            color: white;
        }
        .badge-in { background-color: #27ae60; }
        .badge-out { background-color: #7f8c8d; }
        .badge-alert { background-color: #e74c3c; }
        .badge-normal { background-color: #3498db; }
    </style>
</head>
<body>

    <h1>📋 入退館・セキュリティ履歴一覧</h1>
    
    <div class="nav-links">
        <a href="/">← ライブ監視ダッシュボードへ戻る</a>
        <a href="/admin/members">👥 会員管理画面へ</a>
    </div>

    <div class="panel">
        <h2>過去の通行ログ (最新100件)</h2>
        <table class="logs-table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>日時</th>
                    <th>方向</th>
                    <th>会員ID</th>
                    <th>判定ステータス</th>
                </tr>
            </thead>
            <tbody id="logs-table-body">
                <tr>
                    <td colspan="5" style="color: #888; padding: 20px;">読み込み中...</td>
                </tr>
            </tbody>
        </table>
    </div>

    <script>
        async function fetchLogs() {
            try {
                const response = await fetch('/api/admin/logs');
                const data = await response.json();
                const tbody = document.getElementById('logs-table-body');
                tbody.innerHTML = '';

                if (data.logs.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="5" style="color: #888; padding: 20px;">記録されているログはありません。</td></tr>`;
                    return;
                }

                data.logs.forEach(log => {
                    const tr = document.createElement('tr');
                    const dirBadge = log.direction === 'IN' 
                        ? '<span class="badge badge-in">IN (入館)</span>' 
                        : '<span class="badge badge-out">OUT (退館)</span>';
                    const alertBadge = log.is_alert === 1 
                        ? '<span class="badge badge-alert">🚨 共連れ・不正</span>' 
                        : '<span class="badge badge-normal">正常通行</span>';

                    tr.innerHTML = `
                        <td style="color: #666;">${log.id}</td>
                        <td>${log.timestamp}</td>
                        <td>${dirBadge}</td>
                        <td style="font-family: monospace; font-weight: bold;">${log.member_id}</td>
                        <td>${alertBadge}</td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (err) {
                console.error("ログデータの取得に失敗しました", err);
            }
        }

        // ページ読み込み時にログを取得
        fetchLogs();
    </script>
</body>
</html>
